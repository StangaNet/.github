name: Documentation Improvement
description: Suggest changes to the documentation (typos, clarity, missing info)
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Location of the documentation
      placeholder: Provide the file path or a link to the content.
    validations:
      required: true

  - type: textarea
    id: current_content
    attributes:
      label: Current Content
      placeholder: Paste the current text or describe it.
    validations:
      required: false

  - type: textarea
    id: suggested_change
    attributes:
      label: Suggested Change
      placeholder: What should the content be changed to?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason for Change
      placeholder: Why is this change necessary? (e.g., typo, outdated info, lack of clarity)
    validations:
      required: true
