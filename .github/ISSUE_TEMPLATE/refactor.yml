name: Refactor / Technical Debt
description: Propose a refactor idea (no pull request expected)
title: "[Refactor]: "
labels: ["refactor"]
body:
  - type: markdown
    attributes:
      value: |
        External pull requests are **not** accepted. This template is for proposals only.

  - type: textarea
    id: target_area
    attributes:
      label: Target Area
      placeholder: Specify the file, module, or subsystem that needs refactoring.
    validations:
      required: true

  - type: textarea
    id: current_state
    attributes:
      label: Current State / Problem
      placeholder: Describe the technical debt or code smell (e.g., complexity, lack of testability, outdated pattern).
    validations:
      required: true

  - type: textarea
    id: proposed_refactor
    attributes:
      label: Proposed Refactor
      placeholder: How would you improve this?
    validations:
      required: true

  - type: textarea
    id: benefits
    attributes:
      label: Expected Benefits
      placeholder: What are the advantages? (e.g., better performance, higher testability, improved readability)
    validations:
      required: true
