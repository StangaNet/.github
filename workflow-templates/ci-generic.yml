name: CI — Node.js

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: StangaNet/.github/.github/workflows/ci.yml@main
    with:
      node-version: '20'
    secrets: inherit
